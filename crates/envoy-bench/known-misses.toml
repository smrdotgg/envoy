# Checks that miss their latency budget today (docs/NORTH_STAR.md), per check and per OS.
#
# CI (`envoy-bench check --known-misses`) gates every check at its budget except these, which
# must stay under their ceiling: a known miss that gets meaningfully worse fails the build. One
# that passes its budget raises a "promote" warning annotation: delete its entry once it passes
# reliably (on real hardware too). Entries for checks that weren't measured, ceilings at or
# under the budget, unknown keys and duplicates are all errors. INVALID measurements are never
# forgiven by an entry.
#
# check:   the check's id exactly as the table prints it ("group · name")
# os:      linux | macos | windows (the GitHub runner the CI job uses)
# ceiling: same unit as the check; fails at or above. Worst seen × 1.05 (binary size),
#          × 1.25 (memory), × 1.5 (timings), rounded up
# seen:    what CI measured when the entry was written
#
# Regenerate from CI result artifacts (budgets-<os>/*.json) with:
#   envoy-bench misses --from store.json --from app.json --from size.json [...]
# then review: drop entries that only failed under an older gate policy.
#
# Listed: every check that measured over its budget on that runner, or a store search/open
# timing at 80% of its budget or more, where run-to-run swings of ±20% would flake a hard gate.
# Near-budget entries will often raise the promote warning: they pass some runs.
#
# Written 2026-11-08 from the perf branch's CI runs: app checks, 6 runs of each runner; cold
# start, 9 runs (the startup code didn't change across them); store and size checks, 9 runs.
# Every store search and open now passes with room on every runner (the worst query median:
# 9 ms Linux, 12 ms macOS, 21 ms Windows), and so do Windows' binary size (29.8 MB) and idle
# memory (131–133 MB): their entries are gone. Binary size has passed everywhere since the
# size trim of 2026-11-09 (Linux 29.09 MB, Windows 27.08 MB, macOS 21.85 MB): its entries are
# gone too. What's left is the runners' software GPUs
# (lavapipe on Linux, WARP on Windows, a paravirtualized one in the macOS VM): cold start above
# the OS floor is mostly Rune's own start there (70–1070 ms; 4 ms on an M4 Pro), and frames wait
# on software rasterizing. On the M4 Pro, cold start (8 ms above the floor), keypress → frame
# (p95 15–16 ms) and open pass; search end to end (p95 55 ms on its 60 Hz display) and idle
# memory don't (see the PR that wrote this). No entry means the check gates hard at its budget.

# ── cold start, above the OS's own launch floor ──

[[miss]]
check = "app · cold start → list on screen, above OS floor"
os = "linux"
ceiling = 475
seen = "184.9–313.9 ms over 9 runs, over or within 20% of budget in 9"

[[miss]]
check = "app · cold start → list on screen, above OS floor"
os = "macos"
ceiling = 1045
seen = "256.4–695.9 ms over 9 runs, over or within 20% of budget in 9"

[[miss]]
check = "app · cold start → list on screen, above OS floor"
os = "windows"
ceiling = 1895
seen = "740.2–1262.6 ms over 9 runs, over or within 20% of budget in 9"

