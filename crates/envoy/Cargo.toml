[package]
name = "envoy"
description = "A fast, native, configurable email client"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rune = { workspace = true }
rune-kit = { workspace = true }
envoy-core = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
serde_json = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# Release builds leave out `trace!` logging, every crate's (wgpu, naga, rustls…; Envoy has none),
# so its format strings and call sites aren't in the shipped binary: about 0.2 MB. `RUST_LOG` up
# to `debug` works as before (README); debug builds keep `trace`.
log = { version = "0.4", features = ["release_max_level_debug"] }
