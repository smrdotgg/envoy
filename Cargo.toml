[workspace]
resolver = "3"
members = ["crates/envoy-core", "crates/envoy", "crates/envoy-bench"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Rune's default features less `svg` (SVG images and multicolour icons, rasterized by resvg:
# Envoy's icons are single-colour and its mail images are decoded by envoy-core) and
# `ogg-audio` (macOS Ogg/WebM playback): neither is used, both cost binary size.
rune = { path = "vendor/rune/crates/rune", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend"] }
rune-kit = { path = "vendor/rune/crates/rune-kit", features = ["markdown"] }
envoy-core = { path = "crates/envoy-core" }

# Rune's own deps compile without debug info in dev, as upstream does.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
codegen-units = 16
incremental = true

# What we ship: smaller and a little faster.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
incremental = false
strip = true

# Code that never runs per frame or per keystroke is built for size (docs/NORTH_STAR.md: < 30 MB):
# D-Bus and the AT-SPI bridge (Linux desktop integration), image decoders (remote images in
# mail, off the UI thread), HTML parsing (once per message, then cached), mail parsing, IMAP,
# SMTP, HTTP and TLS (network-bound), the engine's async runtime, the windowing system's event
# plumbing (an event at a time), Wayland protocol tables and client-side decorations, clipboard,
# URL parsing. Rune, wgpu, naga (shaders at startup), text shaping and rasterizing, layout,
# SQLite, serde_json and accessibility tree updates stay at opt-level 3.
[profile.dist.package]
zbus = { opt-level = "s" }
zvariant = { opt-level = "s" }
zbus_names = { opt-level = "s" }
accesskit_unix = { opt-level = "s" }
accesskit_atspi_common = { opt-level = "s" }
atspi = { opt-level = "s" }
atspi-common = { opt-level = "s" }
