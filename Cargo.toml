[workspace]
resolver = "3"
members = ["crates/envoy-html", "crates/envoy-core", "crates/envoy", "crates/envoy-bench"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Rune's default features less `svg` (SVG images and multicolour icons, rasterized by resvg:
# Envoy's icons are single-colour and its mail images are decoded by envoy-core) and
# `ogg-audio` (macOS Ogg/WebM playback): neither is used, both cost binary size.
rune = { path = "vendor/rune/crates/rune", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend"] }
rune-kit = { path = "vendor/rune/crates/rune-kit", features = ["markdown"] }
envoy-core = { path = "crates/envoy-core" }
envoy-html = { path = "crates/envoy-html" }

# Rune's own deps compile without debug info in dev, as upstream does.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
codegen-units = 16
incremental = true

# What we ship: smaller and a little faster.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
incremental = false
strip = true

# Code that never runs per frame is built for size (docs/NORTH_STAR.md: < 30 MB). Rune, wgpu,
# naga (shaders at startup), text shaping and rasterizing, layout, SQLite, serde_json,
# accessibility tree updates, Windows' COM bindings and UI Automation bridge stay at opt-level 3.
[profile.dist.package]
# "s" where speed still counts: image decoders (remote images in mail, off the UI thread), HTML,
# mail and IMAP parsing, TLS and its crypto, the engine's async runtime, the windowing system's
# event loop and input path (winit, Wayland and X11 clients, keyboard), the AT-SPI bridge (busy
# while a screen reader runs), the rasterizer of Wayland's client-side decorations, Vulkan's
# function loader.
image = { opt-level = "s" }
image-webp = { opt-level = "s" }
zune-jpeg = { opt-level = "s" }
zune-core = { opt-level = "s" }
gif = { opt-level = "s" }
weezl = { opt-level = "s" }
png = { opt-level = "s" }
fdeflate = { opt-level = "s" }
miniz_oxide = { opt-level = "s" }
flate2 = { opt-level = "s" }
html5ever = { opt-level = "s" }
envoy-html = { opt-level = "s" }
markup5ever = { opt-level = "s" }
markup5ever_rcdom = { opt-level = "s" }
tendril = { opt-level = "s" }
string_cache = { opt-level = "s" }
htmd = { opt-level = "s" }
html-escape = { opt-level = "s" }
mail-parser = { opt-level = "s" }
async-imap = { opt-level = "s" }
imap-proto = { opt-level = "s" }
nom = { opt-level = "s" }
quoted_printable = { opt-level = "s" }
rustls = { opt-level = "s" }
rustls-webpki = { opt-level = "s" }
ring = { opt-level = "s" }
sha2 = { opt-level = "s" }
rand = { opt-level = "s" }
rand_chacha = { opt-level = "s" }
tokio = { opt-level = "s" }
mio = { opt-level = "s" }
futures-util = { opt-level = "s" }
winit = { opt-level = "s" }
calloop = { opt-level = "s" }
wayland-client = { opt-level = "s" }
wayland-backend = { opt-level = "s" }
smithay-client-toolkit = { opt-level = "s" }
sctk-adwaita = { opt-level = "s" }
x11rb = { opt-level = "s" }
x11rb-protocol = { opt-level = "s" }
xkbcommon-dl = { opt-level = "s" }
xkeysym = { opt-level = "s" }
accesskit_unix = { opt-level = "s" }
accesskit_atspi_common = { opt-level = "s" }
atspi = { opt-level = "s" }
atspi-common = { opt-level = "s" }
atspi-proxies = { opt-level = "s" }
tiny-skia = { opt-level = "s" }
tiny-skia-path = { opt-level = "s" }
ash = { opt-level = "s" }
# "z", smaller still (no loop vectorizing, less inlining), where it doesn't: D-Bus itself and its
# async-io runtime, SMTP and HTTP (network-bound), Wayland protocol tables, X11's library loader,
# cursors, clipboard, URL parsing, the keychain, logging setup.
zbus = { opt-level = "z" }
zvariant = { opt-level = "z" }
zbus_names = { opt-level = "z" }
async-io = { opt-level = "z" }
async-executor = { opt-level = "z" }
async-process = { opt-level = "z" }
async-broadcast = { opt-level = "z" }
blocking = { opt-level = "z" }
polling = { opt-level = "z" }
lettre = { opt-level = "z" }
email-encoding = { opt-level = "z" }
ureq = { opt-level = "z" }
ureq-proto = { opt-level = "z" }
wayland-cursor = { opt-level = "z" }
wayland-protocols = { opt-level = "z" }
wayland-protocols-wlr = { opt-level = "z" }
wayland-protocols-plasma = { opt-level = "z" }
x11-dl = { opt-level = "z" }
xcursor = { opt-level = "z" }
libloading = { opt-level = "z" }
arboard = { opt-level = "z" }
wl-clipboard-rs = { opt-level = "z" }
tree_magic_mini = { opt-level = "z" }
petgraph = { opt-level = "z" }
url = { opt-level = "z" }
idna = { opt-level = "z" }
idna_adapter = { opt-level = "z" }
icu_normalizer = { opt-level = "z" }
icu_properties = { opt-level = "z" }
icu_collections = { opt-level = "z" }
icu_provider = { opt-level = "z" }
keyring = { opt-level = "z" }
env_logger = { opt-level = "z" }
