name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushes and PR updates cancel the run they supersede; manual runs (used to sample the budgets
# on several runners at once) never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Build, test, clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c clippy -c rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      # Lints Envoy's crates only: vendor/ is outside the workspace, so clippy never lints it.
      - name: Clippy
        run: cargo clippy -p envoy -p envoy-html -p envoy-core -p envoy-bench --all-targets --locked -- -D warnings

  # The engine against a real IMAP/SMTP server, GreenMail (crates/envoy-core/examples/e2e.rs):
  # sync, IDLE, flags, moves and sends with their undo windows, drafts, and ops held across a
  # kill. Twice: against GreenMail as it is (UIDPLUS, MOVE, IDLE), then through a proxy that
  # takes UIDPLUS and MOVE away, for the fallbacks. GreenMail's log is in "Stop containers".
  # On a debug build, and on a dist build linked like the shipped Linux binary: with lld's
  # --icf=safe (crates/envoy/build.rs sets it for envoy's binary only, so the example gets it
  # here), which folds identical functions, IMAP, SMTP and TLS code among them.
  e2e:
    name: End to end (GreenMail, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            build: cargo build -p envoy-core --example e2e --locked
          - profile: dist
            build: cargo rustc --profile dist -p envoy-core --example e2e --locked -- -Clink-arg=-Wl,--icf=safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=alice:pw@localhost,erin:pw@localhost -Dgreenmail.users.login=email
        ports:
          - 3025:3025
          - 3143:3143
          - 3465:3465
          - 3993:3993
    env:
      RUST_LOG: envoy_core=debug
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.profile }}
      # As in budgets: either variable, even empty, replaces .cargo/config.toml's rustflags.
      - name: No RUSTFLAGS (they'd drop -addrsig, and lld would fold nothing)
        if: matrix.profile == 'dist'
        run: |
          for v in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS; do
            if [ -n "${!v+set}" ]; then
              echo "::error::$v is set (to '${!v}'). It replaces the rustflags in .cargo/config.toml, so -Cllvm-args=-addrsig is lost and lld's --icf=safe folds nothing: this would test a different binary from the one we ship. Unset it, or put the flags in .cargo/config.toml."
              exit 1
            fi
          done
      - name: Build (${{ matrix.profile }})
        run: ${{ matrix.build }}
      # Each pass waits for GreenMail to answer, and empties its user's mailboxes first.
      - name: "Pass 1: GreenMail as it is (UIDPLUS, MOVE, IDLE)"
        run: target/${{ matrix.profile }}/examples/e2e full
      - name: "Pass 2: a server without UIDPLUS and MOVE"
        run: target/${{ matrix.profile }}/examples/e2e plain

  # Latency budgets (docs/NORTH_STAR.md), against a generated 100k-message mailbox, on the
  # binary we ship (--profile dist). Measure once (tables in the job summary), then gate each
  # budget in its own step. Every check must pass its budget, except the per-check, per-OS
  # entries in crates/envoy-bench/known-misses.toml: those must stay under their ceiling (worst
  # seen × 1.05–1.5), and one that passes its budget raises a "promote" warning so its entry is
  # removed. An INVALID measurement (app crash or bad exit, timeout, missing or miscounted
  # samples) always fails. See crates/envoy-bench for the methods.
  budgets:
    name: Budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # frame_margin multiplies the gate of the app's end-to-end open, and nothing else:
          # on runners without a GPU that frame mostly measures a software rasterizer, and the
          # macOS runner is a noisy VM. The store-side open is gated hard everywhere, and
          # end-to-end open passes at ×1 on real hardware (M4 Pro p95 32 ms). Every other check
          # is gated at the budget: no margin may hide a budget missed on real hardware.
          - os: ubuntu-latest
            bin: target/dist/envoy
            # lavapipe under Xvfb: frame build p95 3.5–5.9 ms, encode+submit p50 23–41 ms;
            # end-to-end open p95 85–161 ms over ten runs (EC2 155–198 ms). ×4 gates at 200 ms.
            frame_margin: "4"
          - os: macos-latest
            bin: target/dist/envoy
            # VM with a paravirtualized GPU, and noisy: end-to-end open p95 37–57 ms over ten runs
            # (single presses up to 706 ms), against 50 ms. ×2 (100 ms) so noise doesn't flake it.
            frame_margin: "2"
          - os: windows-latest
            bin: target/dist/envoy.exe
            # No GPU: frame build p95 13–32 ms, yet key→frame p50 220–340 ms waiting on the
            # software device and present; end-to-end open p95 368–528 ms over ten runs.
            # ×14 gates at 700 ms.
            frame_margin: "14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      MISSES: crates/envoy-bench/known-misses.toml
    steps:
      - uses: actions/checkout@v7
      - name: Where the mailbox goes
        run: echo "MAILBOX=$RUNNER_TEMP/mailbox" >> "$GITHUB_ENV"
      - name: Linux packages (build, Xvfb, software Vulkan)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 xvfb mesa-vulkan-drivers
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c clippy -c rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist
      # Either variable, even empty, replaces the rustflags in .cargo/config.toml: on Linux that
      # drops -Cllvm-args=-addrsig, lld's --icf=safe folds nothing, and the budgets would measure
      # a bigger binary than the one we ship.
      - name: No RUSTFLAGS (they'd drop .cargo/config.toml's -addrsig)
        if: runner.os == 'Linux'
        run: |
          for v in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS; do
            if [ -n "${!v+set}" ]; then
              echo "::error::$v is set (to '${!v}'). It replaces the rustflags in .cargo/config.toml, so -Cllvm-args=-addrsig is lost and lld's --icf=safe folds nothing: the budgets would measure a different binary from the one we ship. Unset it, or put the flags in .cargo/config.toml."
              exit 1
            fi
          done
      - name: Build what we ship (--profile dist)
        run: cargo build --profile dist -p envoy -p envoy-bench --locked
      - name: Generate a 100k-message mailbox
        run: target/dist/envoy-bench gen --home "$MAILBOX" --messages 100000

      # Measure steps fail only on an INVALID measurement; gates come after.
      - name: "Measure: binary size"
        run: target/dist/envoy-bench size --bin ${{ matrix.bin }} --measure-only --json "$MAILBOX/size.json" --markdown "$GITHUB_STEP_SUMMARY" --label "${{ matrix.os }}"
      - name: "Measure: search and open on the engine's code path"
        run: target/dist/envoy-bench store --home "$MAILBOX" --measure-only --json "$MAILBOX/store.json" --markdown "$GITHUB_STEP_SUMMARY" --label "${{ matrix.os }}"
      - name: "Measure: the app in a real window (5 cold starts)"
        run: |
          args=(app --home "$MAILBOX" --bin ${{ matrix.bin }} --runs 5 --frame-margin ${{ matrix.frame_margin }} --measure-only --json "$MAILBOX/app.json" --markdown "$GITHUB_STEP_SUMMARY" --label "${{ matrix.os }}")
          if [ "$RUNNER_OS" = Linux ]; then
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json xvfb-run -a -s "-screen 0 1920x1080x24" target/dist/envoy-bench "${args[@]}"
          else
            target/dist/envoy-bench "${args[@]}"
          fi

      # Hard gates. Steps whose checks have KNOWN BUDGET MISS entries say so in their name;
      # the entries are per check and per OS, and each has a ceiling.
      - name: "Budget: open a cached message < 50 ms"
        run: target/dist/envoy-bench check --known-misses "$MISSES" --from "$MAILBOX/store.json" --from "$MAILBOX/app.json" --only "open · " --only "app · open message" --label "${{ matrix.os }}"
      - name: "Budget: binary size < 30 MB"
        run: target/dist/envoy-bench check --known-misses "$MISSES" --from "$MAILBOX/size.json" --only "binary · " --label "${{ matrix.os }}"
      - name: "Budget: local search < 50 ms (KNOWN BUDGET MISS: end to end)"
        run: target/dist/envoy-bench check --known-misses "$MISSES" --from "$MAILBOX/store.json" --from "$MAILBOX/app.json" --only "search · " --only "app · search, end to end" --label "${{ matrix.os }}"
      - name: "Budget: cold start above the OS launch floor < 100 ms (KNOWN BUDGET MISS)"
        run: target/dist/envoy-bench check --known-misses "$MISSES" --from "$MAILBOX/app.json" --only "app · cold start" --label "${{ matrix.os }}"
      - name: "Budget: keypress → frame < 16 ms (KNOWN BUDGET MISS)"
        run: target/dist/envoy-bench check --known-misses "$MISSES" --from "$MAILBOX/app.json" --only "app · keypress → frame" --label "${{ matrix.os }}"
      - name: "Budget: idle memory < 150 MB (KNOWN BUDGET MISS on Linux)"
        run: target/dist/envoy-bench check --known-misses "$MISSES" --from "$MAILBOX/app.json" --only "app · idle memory" --label "${{ matrix.os }}"

      - name: Upload results and app logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: budgets-${{ matrix.os }}
          path: |
            ${{ env.MAILBOX }}/*.json
            ${{ env.MAILBOX }}/bench-run-*
          if-no-files-found: ignore
